<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario della Comunità — U.P. Meloncello-Ravone</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: transparent;
    overflow: hidden;
  }
  :root {
    /* PALETTE CIANO — colore istituzionale #45818e */
    --blu: #45818e; --blu-dark: #35646e; --blu-light: #e4eef0;
    --oro: #c8973a;
    --verde: #2d7a3a; --arancio: #a33a00; --viola: #c2185b;
    --grigio: #5a5a5a; --testo: #1c1c1c; --testo-sec: #566468;
    --bordo: #cbdde0; --radius: 8px;

    /* Bande colorate trasparenti — Oggi e Mese */
    --bg-festivita:  rgba(200, 151,  58, 0.18);
    --bg-messe:      rgba( 69, 129, 142, 0.13);
    --bg-preghiera:  rgba( 31,  78, 121, 0.11);
    --bg-fraternita: rgba( 91,  33, 182, 0.10);
    --bg-catechismo: rgba(163,  58,   0, 0.10);
    --bg-caritas:    rgba( 45, 122,  58, 0.12);
    --bg-tempo:      rgba(194,  24,  91, 0.10);
    --bg-info:       rgba( 74,  85,  96, 0.07);

    /* Bordi laterali */
    --brd-festivita:  #c8973a;
    --brd-messe:      #45818e;
    --brd-preghiera:  #1f4e79;
    --brd-fraternita: #5b21b6;
    --brd-catechismo: #a33a00;
    --brd-caritas:    #2d7a3a;
    --brd-tempo:      #c2185b;
    --brd-info:       #4a5560;
  }

  /* WRAPPER: si adatta a QUALSIASI altezza/larghezza dell'iframe */
  #cal-wrapper {
    width: 100%;
    height: 100%;
    background: white;
    border-radius: var(--radius);
    box-shadow: 0 3px 16px rgba(53,100,110,0.14);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 260px;
  }

  /* Scrollbar sottili */
  #oggi-view, #list-view, #grid-view, #cal-legend { scrollbar-width: thin; scrollbar-color: #b8d1d6 transparent; }
  #oggi-view::-webkit-scrollbar, #list-view::-webkit-scrollbar, #grid-view::-webkit-scrollbar { width: 7px; height: 7px; }
  #oggi-view::-webkit-scrollbar-thumb, #list-view::-webkit-scrollbar-thumb, #grid-view::-webkit-scrollbar-thumb { background: #b8d1d6; border-radius: 4px; }
  #cal-legend::-webkit-scrollbar { height: 0; }

  /* HEADER — compatto */
  #cal-header {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--blu); padding: .45rem .7rem; color: white;
    gap: 8px; flex-shrink: 0; min-width: 0;
  }
  .header-title { font-size: 12px; font-weight: 700; letter-spacing: .03em; color: #fff; line-height: 1.15;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-sub   { font-size: 9px; color: rgba(255,255,255,.6); margin-top: 1px; line-height: 1.15;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cal-nav { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
  #cal-nav button {
    background: rgba(255,255,255,.14); border: none; border-radius: 5px;
    color: white; cursor: pointer; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s; padding: 0;
  }
  #cal-nav button:hover { background: rgba(255,255,255,.3); }
  #cal-nav button svg { width: 15px; height: 15px; fill: currentColor; }
  #cal-month-label { font-size: 11.5px; font-weight: 600; color: #fff; min-width: 96px; text-align: center;
                     white-space: nowrap; }

  /* TOGGLE — compatto */
  #view-toggle {
    display: flex; background: var(--blu-light);
    border-bottom: 1px solid var(--bordo); padding: 0 .6rem;
    flex-shrink: 0;
  }
  #view-toggle button {
    background: none; border: none; padding: .3rem .7rem;
    font-size: 11.5px; cursor: pointer; color: var(--testo-sec);
    border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s;
    display: flex; align-items: center; gap: 5px; font-family: inherit;
  }
  #view-toggle button svg { width: 13px; height: 13px; fill: currentColor; opacity: .8; }
  #view-toggle button.active { color: var(--blu-dark); border-bottom-color: var(--oro); font-weight: 700; }
  #view-toggle button.active svg { opacity: 1; }
  #view-toggle button:hover:not(.active) { color: var(--blu-dark); }

  /* CORPO SCROLLABILE */
  #cal-body { flex: 1 1 0; min-height: 0; overflow: hidden; position: relative; display: flex; flex-direction: column; }

  /* LEGENDA — riga unica, scorrevole, non ruba altezza */
  #cal-legend {
    display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 10px;
    padding: .32rem .7rem; background: #f3f8f9; border-top: 1px solid var(--bordo);
    font-size: 9.5px; color: var(--testo-sec); flex-shrink: 0; align-items: center;
  }
  .legend-item { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .legend-item svg { width: 11px; height: 11px; fill: currentColor; flex-shrink: 0; }

  /* FOOTER */
  #cal-footer { text-align: center; font-size: 9px; color: rgba(255,255,255,.55); background: var(--blu); padding: .28rem 0; flex-shrink: 0; letter-spacing: .03em; }

  /* LOADING */
  #cal-loading { padding: 1.6rem 1rem; text-align: center; color: var(--testo-sec); font-size: 12px; }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--blu-light); border-top-color: var(--blu-dark); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ico { flex-shrink: 0; display: block; }

  /* ══════════════════════════════════════════
     VISTA OGGI
  ══════════════════════════════════════════ */
  #oggi-view { display: none; overflow-y: auto; flex: 1 1 0; min-height: 0; padding: .55rem .6rem .7rem; }
  .oggi-intestazione {
    font-size: 11px; font-weight: 700; color: var(--blu-dark);
    text-transform: uppercase; letter-spacing: .07em;
    margin-bottom: .5rem; text-align: center;
    border-bottom: 2px solid var(--oro); padding-bottom: .3rem;
  }
  .oggi-nessun { text-align: center; padding: 1.1rem .8rem; color: var(--testo-sec); font-size: 12px; line-height: 1.5; }
  .oggi-nessun svg { width: 26px; height: 26px; fill: #aec7cb; margin: 0 auto .4rem; display: block; }

  /* FESTIVITÀ — banda compatta sempre in cima */
  .fest-strip {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg-festivita);
    border-left: 3px solid var(--brd-festivita);
    border-radius: 5px; padding: .3rem .5rem; margin-bottom: .3rem;
    cursor: pointer; transition: filter .12s;
  }
  .fest-strip:hover { filter: brightness(.96); }
  .fest-strip .ico { color: #a3730c; }
  .fest-strip .fest-txt {
    font-size: 12px; font-weight: 700; color: #6d4c07; line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
  }
  .fest-sep { height: 1px; background: var(--bordo); margin: .45rem 0 .5rem; flex-shrink: 0; }

  .oggi-card {
    background: white;
    border: 1px solid var(--bordo);
    border-left: 4px solid var(--blu);
    border-radius: 7px;
    padding: .5rem .6rem;
    margin-bottom: .4rem;
    cursor: pointer;
    transition: box-shadow .15s, transform .1s;
    display: flex; align-items: center; gap: .6rem;
  }
  .oggi-card:hover { box-shadow: 0 3px 12px rgba(53,100,110,.16); transform: translateY(-1px); }
  .oggi-card.messe      { border-left-color: var(--brd-messe);      background: var(--bg-messe); }
  .oggi-card.preghiera  { border-left-color: var(--brd-preghiera);  background: var(--bg-preghiera); }
  .oggi-card.fraternita { border-left-color: var(--brd-fraternita); background: var(--bg-fraternita); }
  .oggi-card.catechismo { border-left-color: var(--brd-catechismo); background: var(--bg-catechismo); }
  .oggi-card.caritas    { border-left-color: var(--brd-caritas);    background: var(--bg-caritas); }
  .oggi-card.tempo      { border-left-color: var(--brd-tempo);      background: var(--bg-tempo); }
  .oggi-card.info       { border-left-color: var(--brd-info);       background: var(--bg-info); }
  .oggi-card.festività  { border-left-color: var(--brd-festivita);  background: var(--bg-festivita); }

  .oggi-card-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .oggi-card-body { flex: 1; min-width: 0; }
  .oggi-card-orario { font-size: 15px; font-weight: 800; color: var(--blu-dark); line-height: 1.1; margin-bottom: 1px; }
  .oggi-card-titolo { font-size: 13px; font-weight: 700; color: var(--testo); line-height: 1.25;
                      overflow: hidden; text-overflow: ellipsis; }
  .oggi-card-luogo  { font-size: 10.5px; color: var(--testo-sec); margin-top: 2px; line-height: 1.3;
                      display: flex; align-items: flex-start; gap: 3px; }
  .oggi-card-luogo svg { width: 10px; height: 10px; fill: currentColor; margin-top: 2px; flex-shrink: 0; }
  .luogo-txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* PULSANTE ALLEGATO */
  .att-btn {
    flex-shrink: 0; align-self: stretch; margin-left: auto;
    display: inline-flex; align-items: center; justify-content: center; flex-direction: column; gap: 1px;
    padding: 0 10px; border-radius: 6px;
    background: linear-gradient(135deg,#e8a000,#c8973a); color: #fff; text-decoration: none;
    cursor: pointer; transition: transform .15s, box-shadow .15s;
    box-shadow: 0 2px 7px rgba(200,150,0,.35); white-space: nowrap; min-width: 46px;
  }
  .att-btn:hover { transform: scale(1.05); box-shadow: 0 3px 12px rgba(200,150,0,.55); }
  .att-btn svg { width: 15px; height: 15px; fill: currentColor; }
  .att-btn span { font-size: 8.5px; font-weight: 800; letter-spacing: .05em; line-height: 1; }

  /* ══════════════════════════════════════════
     VISTA MESE
  ══════════════════════════════════════════ */
  #list-view { display: none; overflow-y: auto; flex: 1 1 0; min-height: 0; padding: .5rem .6rem .7rem; }
  .list-day-group { margin-bottom: .6rem; }
  .list-day-header {
    font-size: 12px; font-weight: 800; color: var(--blu-dark);
    text-transform: uppercase; letter-spacing: .04em;
    border-bottom: 2px solid var(--blu-light);
    padding-bottom: 2px; margin-bottom: 4px;
    position: sticky; top: -.5rem; background: #fff; z-index: 1;
  }
  .list-event {
    display: flex; align-items: center; gap: 7px; padding: 4px 6px;
    border-radius: 6px; cursor: pointer; transition: filter .1s; margin-bottom: 3px;
    border-left: 3px solid transparent;
  }
  .list-event:hover { filter: brightness(.95); }
  .list-event.festività  { border-left-color: var(--brd-festivita);  background: var(--bg-festivita); }
  .list-event.messe      { border-left-color: var(--brd-messe);      background: var(--bg-messe); }
  .list-event.preghiera  { border-left-color: var(--brd-preghiera);  background: var(--bg-preghiera); }
  .list-event.fraternita { border-left-color: var(--brd-fraternita); background: var(--bg-fraternita); }
  .list-event.catechismo { border-left-color: var(--brd-catechismo); background: var(--bg-catechismo); }
  .list-event.caritas    { border-left-color: var(--brd-caritas);    background: var(--bg-caritas); }
  .list-event.tempo      { border-left-color: var(--brd-tempo);      background: var(--bg-tempo); }
  .list-event.info       { border-left-color: var(--brd-info);       background: var(--bg-info); }
  .list-event.festività .list-event-title { color: #6d4c07; }

  .list-event-icon { width: 16px; height: 16px; flex-shrink: 0; }
  .list-event-body { flex: 1; min-width: 0; }
  .list-event-orario { font-size: 12px; font-weight: 800; color: var(--blu-dark); line-height: 1.15; }
  .list-event-title  { font-size: 12px; font-weight: 600; color: var(--testo); line-height: 1.25;
                       overflow: hidden; text-overflow: ellipsis; }
  .list-event-luogo  { font-size: 10px; color: var(--testo-sec); margin-top: 1px; line-height: 1.3;
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ══════════════════════════════════════════
     VISTA GRIGLIA
  ══════════════════════════════════════════ */
  #grid-view { display: none; overflow: auto; flex: 1 1 0; min-height: 0; -webkit-overflow-scrolling: touch; }
  .grid-inner { min-width: 480px; }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    background: var(--blu-light); border-bottom: 1px solid var(--bordo);
    position: sticky; top: 0; z-index: 2;
  }
  .cal-weekdays div { text-align: center; padding: .25rem 0; font-size: 9.5px; font-weight: 700;
                      color: var(--blu-dark); text-transform: uppercase; letter-spacing: .05em; }
  .cal-weekdays div.domenica { color: var(--oro); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-day { border-right: .5px solid #e2edee; border-bottom: .5px solid #e2edee;
             min-height: 62px; padding: 3px 3px 2px; position: relative; }
  .cal-day:nth-child(7n) { border-right: none; }
  .cal-day.altro-mese { background: #fafcfc; }
  .cal-day.altro-mese .day-num { color: #b9cacd; }
  .cal-day.oggi { background: #fff9ee; }
  .cal-day.oggi .day-num { background: var(--oro); color: white; border-radius: 50%; font-weight: 700; }
  .cal-day.domenica .day-num { color: var(--oro); font-weight: 600; }
  .day-num { font-size: 10.5px; color: var(--testo); width: 18px; height: 18px;
             display: flex; align-items: center; justify-content: center; margin-bottom: 1px; }
  .day-events { display: flex; flex-direction: column; gap: 1.5px; }
  .event-pill {
    font-size: 9px; line-height: 1.35; padding: 1px 3px; border-radius: 3px;
    color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; transition: opacity .1s; display: flex; align-items: center; gap: 3px;
  }
  .event-pill:hover { opacity: .82; }
  .event-pill.continua-sx { border-radius: 0 3px 3px 0; padding-left: 2px; }
  .event-pill.continua-dx { border-radius: 3px 0 0 3px; padding-right: 2px; }
  .event-pill.continua-entrambi { border-radius: 0; }
  .event-pill .ico { width: 9px; height: 9px; }
  .event-pill span.pill-txt { overflow: hidden; text-overflow: ellipsis; }
  .event-pill.festività  { background: #b8860b; }
  .event-pill.messe      { background: var(--blu); }
  .event-pill.preghiera  { background: #1f4e79; }
  .event-pill.fraternita { background: #5b21b6; }
  .event-pill.catechismo { background: var(--arancio); }
  .event-pill.caritas    { background: var(--verde); }
  .event-pill.tempo      { background: var(--viola); }
  .event-pill.info       { background: #4a5560; }
  .more-events { font-size: 8.5px; color: var(--testo-sec); padding: 0 3px; cursor: pointer; }

  /* POPUP */
  #popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 998; }
  #event-popup {
    display: none; position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%); background: white; border-radius: 10px;
    box-shadow: 0 8px 36px rgba(0,0,0,.2); padding: 1rem 1.1rem;
    z-index: 999; width: 92%; max-width: 340px; border-top: 4px solid var(--blu);
    max-height: 88%; overflow-y: auto;
  }
  #event-popup h4 { font-size: 14px; font-weight: 700; color: var(--blu-dark); margin-bottom: .35rem; padding-right: 1.4rem; line-height: 1.3; }
  .popup-row { font-size: 12px; color: var(--testo-sec); margin-bottom: 2px; line-height: 1.45;
               display: flex; align-items: flex-start; gap: 5px; }
  .popup-row svg { width: 12px; height: 12px; fill: currentColor; margin-top: 2px; flex-shrink: 0; }
  .popup-row:empty { display: none; }
  #popup-close { position: absolute; top: 6px; right: 8px; background: none; border: none; cursor: pointer;
                 width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
                 color: var(--testo-sec); border-radius: 5px; }
  #popup-close:hover { background: #e9f3f4; }
  #popup-close svg { width: 15px; height: 15px; fill: currentColor; }
  .popup-att {
    display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 6px;
    background: #e9f3f5; border: 1px solid #b3d0d6; color: #45818e;
    font-size: 12px; font-weight: 600; text-decoration: none; transition: background .15s;
  }
  .popup-att:hover { background: #d6e9ec; }
  .popup-att svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

  /* ADATTAMENTO A IFRAME BASSI */
  @media (max-height: 520px) {
    .oggi-card { padding: .38rem .5rem; margin-bottom: .3rem; }
    .oggi-card-orario { font-size: 13.5px; }
    .oggi-card-titolo { font-size: 12px; }
    .oggi-card-luogo { display: none; }
    .oggi-intestazione { font-size: 10px; margin-bottom: .35rem; }
    .cal-day { min-height: 48px; }
    #cal-footer { display: none; }
  }
  @media (max-height: 400px) {
    #cal-legend { display: none; }
    .header-sub { display: none; }
  }

  /* ADATTAMENTO A IFRAME STRETTI */
  @media (max-width: 460px) {
    #cal-header { padding: .4rem .5rem; }
    .header-title { font-size: 11px; }
    #cal-month-label { min-width: 78px; font-size: 10.5px; }
    #view-toggle button { padding: .3rem .55rem; font-size: 11px; }
    #view-toggle button svg { display: none; }
    .oggi-card-orario { font-size: 14px; }
    .oggi-card-titolo { font-size: 12.5px; }
    .list-day-header { font-size: 11px; }
    .grid-inner { min-width: 420px; }
  }
</style>
</head>
<body>
<div id="cal-wrapper">

  <!-- HEADER FISSO -->
  <div id="cal-header">
    <div style="min-width:0">
      <div class="header-title">CALENDARIO DELLA COMUNITÀ</div>
      <div class="header-sub">Zona Pastorale MERA · Bologna</div>
    </div>
    <div id="cal-nav">
      <button id="btn-prev" title="Mese precedente" aria-label="Mese precedente"></button>
      <div id="cal-month-label">—</div>
      <button id="btn-next" title="Mese successivo" aria-label="Mese successivo"></button>
    </div>
  </div>

  <!-- TOGGLE FISSO -->
  <div id="view-toggle">
    <button id="btn-oggi-btn">Oggi</button>
    <button id="btn-list">Mese</button>
    <button id="btn-grid">Griglia</button>
  </div>

  <!-- CORPO SCROLLABILE -->
  <div id="cal-body">
    <div id="cal-loading"><div class="spinner"></div>Caricamento eventi…</div>
    <div id="oggi-view"></div>
    <div id="list-view"></div>
    <div id="grid-view">
      <div class="grid-inner">
        <div class="cal-weekdays">
          <div class="domenica">Dom</div>
          <div>Lun</div><div>Mar</div><div>Mer</div>
          <div>Gio</div><div>Ven</div><div>Sab</div>
        </div>
        <div class="cal-grid" id="cal-cells"></div>
      </div>
    </div>
  </div>

  <!-- LEGENDA FISSA (generata da CALENDARI) -->
  <div id="cal-legend"></div>

  <!-- FOOTER FISSO -->
  <div id="cal-footer">zonapastoralemera.org</div>
</div>

<div id="popup-overlay"></div>
<div id="event-popup">
  <button id="popup-close" title="Chiudi" aria-label="Chiudi"></button>
  <h4 id="popup-title"></h4>
  <div class="popup-row" id="popup-cat"></div>
  <div class="popup-row" id="popup-date"></div>
  <div class="popup-row" id="popup-time"></div>
  <div class="popup-row" id="popup-loc"></div>
  <div class="popup-row" id="popup-desc"></div>
  <div id="popup-allegati" style="margin-top:.6rem;display:flex;flex-direction:column;gap:5px;"></div>
</div>

<script>
/* ══════════════════════════════════════════
   ICONE SVG (sostituiscono le emoji)
══════════════════════════════════════════ */
const SVG_NS = 'http://www.w3.org/2000/svg';
const ICONE = {
  'info':       'M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z',
  'festività':  'M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z',

function icona(nome, classeCss, colore) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('class', 'ico' + (classeCss ? ' ' + classeCss : ''));
  if (colore) svg.style.color = colore;
  const p = document.createElementNS(SVG_NS, 'path');
  p.setAttribute('d', ICONE[nome] || ICONE['info']);
  p.setAttribute('fill', 'currentColor');
  svg.appendChild(p);
  return svg;
}
function iconaEvento(ev, classeCss) {
  return icona(ev._classe, classeCss, COLORI[ev._classe]);
}

              'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GIORNI_LONG = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];

let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let allEvents    = [];
let currentView  = 'oggi';

/* Legenda + icone pulsanti generate da codice */
(function initChrome() {

    const d = document.createElement('div');

function updateLabel() {
  document.getElementById('cal-month-label').textContent = MESI[currentMonth] + ' ' + currentYear;
}

function fmtData(dt) {
  if (!dt) return '';
  return new Date(dt.dateTime || dt.date)
    .toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function fmtOra(dt) {
  if (!dt || !dt.dateTime) return 'Tutto il giorno';
  return new Date(dt.dateTime).toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
}
function isTuttoIlGiorno(ev) { return !ev.start.dateTime; }

/* Date SEMPRE in orario locale (niente sfasamenti UTC) */
function localStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function toDateStr(dt) {
  if (!dt) return null;
  if (dt.date) return dt.date;
  return localStr(new Date(dt.dateTime));
}
function addDays(dateStr, n) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dd = new Date(y, m-1, d);
  dd.setDate(dd.getDate() + n);
  return localStr(dd);
}
function cellDateStr(year, month, day) {
  return year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
}

/* FESTIVITÀ SEMPRE PER PRIME */
function isFestivita(ev) { return ev._classe === 'festività'; }
function ordinaConFestivitaInCima(arr) {
  return arr.slice().sort((a, b) => {
    const fa = isFestivita(a) ? 0 : 1, fb = isFestivita(b) ? 0 : 1;
    if (fa !== fb) return fa - fb;
    const ta = !!a.start.dateTime, tb = !!b.start.dateTime;
    if (ta !== tb) return ta ? -1 : 1;
    return new Date(a.start.dateTime || a.start.date) - new Date(b.start.dateTime || b.start.date);
  });
}

/* Navigazione mese */
document.getElementById('btn-prev').addEventListener('click', () => {
  currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  updateLabel(); loadEvents();
});
document.getElementById('btn-next').addEventListener('click', () => {
  currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  updateLabel(); loadEvents();
});

async function loadEvents() {
  document.getElementById('cal-loading').style.display  = 'block';
  document.getElementById('oggi-view').style.display    = 'none';
  document.getElementById('grid-view').style.display    = 'none';
  document.getElementById('list-view').style.display    = 'none';

  const start = new Date(currentYear, currentMonth, 1).toISOString();
  const end   = new Date(currentYear, currentMonth + 1, 0, 23, 59, 59).toISOString();

  try {
    const promises = CALENDARI.map(cal => {
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events`
        + `?key=${API_KEY}`
        + `&timeMin=${encodeURIComponent(start)}`
        + `&timeMax=${encodeURIComponent(end)}`
        + `&singleEvents=true&orderBy=startTime&maxResults=250&supportsAllDrives=true`
        + `&fields=items(id,summary,description,start,end,location,attachments)`;
      return fetch(url).then(r => r.json()).then(data => {
        if (data.error) return [];
        return (data.items || []).map(ev => ({ ...ev, _classe: cal.classe, _calNome: cal.nome }));
      }).catch(() => []);
    });
    const results = await Promise.all(promises);
    allEvents = results.flat().sort((a,b) =>
      new Date(a.start.dateTime||a.start.date) - new Date(b.start.dateTime||b.start.date));
    renderCurrent();
  } catch(e) {
    document.getElementById('cal-loading').style.display = 'none';
  }
}

function renderCurrent() {
  document.getElementById('cal-loading').style.display = 'none';
  document.getElementById('oggi-view').style.display   = 'none';
  document.getElementById('grid-view').style.display   = 'none';
  document.getElementById('list-view').style.display   = 'none';

  if (currentView === 'oggi')  renderOggi();
  else if (currentView === 'grid') renderGrid();
  else renderList();
}

/* Pulsante allegato condiviso */
function creaBtnAllegato(ev) {
  if (!ev.attachments || !ev.attachments.length) return null;
  const a = document.createElement('a');
  a.className = 'att-btn';
  a.href = ev.attachments[0].fileUrl;
  a.target = '_blank';
  a.rel = 'noopener';
  const mime = ev.attachments[0].mimeType || '';
  const nome = mime.includes('image') ? 'immagine' : mime.includes('pdf') ? 'file' : 'allegato';
  a.appendChild(icona(nome));
  const lbl = document.createElement('span');
  lbl.textContent = 'APRI';
  a.appendChild(lbl);
  a.addEventListener('click', e => e.stopPropagation());
  return a;
}
function creaLuogo(testo, clsRiga) {
  const div = document.createElement('div');
  div.className = clsRiga;
  div.appendChild(icona('luogo'));
  const t = document.createElement('span');
  t.className = 'luogo-txt';
  t.textContent = testo;
  div.appendChild(t);
  return div;
}

/* ══════════════════════════════════════════
   VISTA OGGI — festività in cima
══════════════════════════════════════════ */
function renderOggi() {
  const ov = document.getElementById('oggi-view');
  ov.style.display = 'block';
  ov.innerHTML = '';

  const oggi = new Date();
  const oggiStr = localStr(oggi);

  const intestazione = document.createElement('div');
  intestazione.className = 'oggi-intestazione';
  const giorno = GIORNI_LONG[oggi.getDay()];
  intestazione.textContent = giorno.charAt(0).toUpperCase() + giorno.slice(1) + ', '
    + oggi.getDate() + ' ' + MESI[oggi.getMonth()] + ' ' + oggi.getFullYear();
  ov.appendChild(intestazione);

  if (currentYear !== oggi.getFullYear() || currentMonth !== oggi.getMonth()) {
    const msg = document.createElement('div');
    msg.className = 'oggi-nessun';
    msg.appendChild(icona('data'));
    msg.appendChild(document.createTextNode('Stai guardando un mese diverso. Gli appuntamenti di oggi si trovano nel mese corrente.'));
    ov.appendChild(msg);
    return;
  }

  const evOggi = allEvents.filter(ev => {
    const start = toDateStr(ev.start);
    let end = toDateStr(ev.end);
    if (ev.end && ev.end.date) end = addDays(end, -1);
    return start <= oggiStr && oggiStr <= end;
  });

  const festivita = evOggi.filter(isFestivita);
  const altri     = ordinaConFestivitaInCima(evOggi.filter(ev => !isFestivita(ev)));

  /* FESTIVITÀ: bande compatte sempre in alto */
  festivita.forEach(ev => {
    const s = document.createElement('div');
    s.className = 'fest-strip';
    s.appendChild(icona('festività'));
    const t = document.createElement('div');
    t.className = 'fest-txt';
    t.textContent = ev.summary || '(senza titolo)';
    t.title = ev.summary || '';
    s.appendChild(t);
    const att = creaBtnAllegato(ev);
    if (att) s.appendChild(att);
    s.addEventListener('click', () => showPopup(ev));
    ov.appendChild(s);
  });
  if (festivita.length && altri.length) {
    const sep = document.createElement('div');
    sep.className = 'fest-sep';
    ov.appendChild(sep);
  }

  if (!altri.length) {
    const nessun = document.createElement('div');
    nessun.className = 'oggi-nessun';
    nessun.appendChild(icona('vuoto'));
    nessun.appendChild(document.createTextNode('Nessun appuntamento programmato per oggi.'));
    ov.appendChild(nessun);
    return;
  }

  altri.forEach(ev => {
    const card = document.createElement('div');
    card.className = 'oggi-card ' + ev._classe;
    card.appendChild(iconaEvento(ev, 'oggi-card-icon'));

    const body = document.createElement('div');
    body.className = 'oggi-card-body';

    if (!isTuttoIlGiorno(ev)) {
      const orario = document.createElement('div');
      orario.className = 'oggi-card-orario';
      orario.textContent = fmtOra(ev.start);
      body.appendChild(orario);
    }

    const titolo = document.createElement('div');
    titolo.className = 'oggi-card-titolo';
    titolo.textContent = ev.summary || '(senza titolo)';
    body.appendChild(titolo);

    if (ev.location) body.appendChild(creaLuogo(ev.location, 'oggi-card-luogo'));

    card.appendChild(body);
    const att = creaBtnAllegato(ev);
    if (att) card.appendChild(att);

    card.addEventListener('click', () => showPopup(ev));
    ov.appendChild(card);
  });
}

/* ══════════════════════════════════════════
   VISTA MESE — festività in cima ad ogni giorno
══════════════════════════════════════════ */
function renderList() {
  const lv = document.getElementById('list-view');
  lv.style.display = 'block';
  lv.innerHTML = '';

  if (!allEvents.length) {
    lv.innerHTML = '<p style="font-size:12px;color:#5a5a5a;padding:1.2rem 0;text-align:center">Nessun evento in questo mese.</p>';
    return;
  }

  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const isMeseCorrente = currentYear === oggi.getFullYear() && currentMonth === oggi.getMonth();

  const grouped = {};
  const groupOrder = [];

  allEvents.forEach(ev => {
    const dataEv = new Date(ev.start.dateTime || ev.start.date);
    dataEv.setHours(0,0,0,0);
    if (isMeseCorrente && dataEv < oggi) return;

    const key = localStr(dataEv);
    const label = dataEv.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' }).toUpperCase();

    if (!grouped[key]) { grouped[key] = { label, events: [] }; groupOrder.push(key); }
    grouped[key].events.push(ev);
  });

  if (!groupOrder.length) {
    lv.innerHTML = '<p style="font-size:12px;color:#5a5a5a;padding:1.2rem 0;text-align:center">Nessun altro evento in questo mese.</p>';
    return;
  }

  groupOrder.sort();

  groupOrder.forEach(key => {
    const { label } = grouped[key];
    const events = ordinaConFestivitaInCima(grouped[key].events);
    const grp = document.createElement('div');
    grp.className = 'list-day-group';

    const hdr = document.createElement('div');
    hdr.className = 'list-day-header';
    hdr.textContent = label;
    grp.appendChild(hdr);

    events.forEach(ev => {
      const row = document.createElement('div');
      row.className = 'list-event ' + ev._classe;
      row.appendChild(iconaEvento(ev, 'list-event-icon'));

      const body = document.createElement('div');
      body.className = 'list-event-body';

      if (!isTuttoIlGiorno(ev)) {
        const orario = document.createElement('div');
        orario.className = 'list-event-orario';
        orario.textContent = fmtOra(ev.start);
        body.appendChild(orario);
      }

      const titolo = document.createElement('div');
      titolo.className = 'list-event-title';
      titolo.textContent = ev.summary || '(senza titolo)';
      body.appendChild(titolo);

      if (ev.location) {
        const luogo = document.createElement('div');
        luogo.className = 'list-event-luogo';
        luogo.textContent = ev.location;
        luogo.title = ev.location;
        body.appendChild(luogo);
      }

      row.appendChild(body);
      const att = creaBtnAllegato(ev);
      if (att) row.appendChild(att);

      row.addEventListener('click', () => showPopup(ev));
      grp.appendChild(row);
    });

    lv.appendChild(grp);
  });
}

/* ══════════════════════════════════════════
   VISTA GRIGLIA — festività prima pillola
══════════════════════════════════════════ */
function renderGrid() {
  document.getElementById('grid-view').style.display = 'block';
  const cells = document.getElementById('cal-cells');
  cells.innerHTML = '';

  const firstDay    = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const daysInPrev  = new Date(currentYear, currentMonth, 0).getDate();
  const today       = new Date();

  function eventsForDay(dayStr) {
    return ordinaConFestivitaInCima(allEvents.filter(ev => {
      const start = toDateStr(ev.start);
      let end = toDateStr(ev.end);
      if (ev.end && ev.end.date) end = addDays(end, -1);
      return start <= dayStr && dayStr <= end;
    }));
  }

  for (let i = firstDay - 1; i >= 0; i--) {
    const cell = document.createElement('div');
    cell.className = 'cal-day altro-mese';
    cell.innerHTML = `<div class="day-num">${daysInPrev - i}</div>`;
    cells.appendChild(cell);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dow     = new Date(currentYear, currentMonth, d).getDay();
    const isToday = currentYear === today.getFullYear()
                 && currentMonth === today.getMonth()
                 && d === today.getDate();
    const cell    = document.createElement('div');
    cell.className = 'cal-day' + (dow === 0 ? ' domenica' : '') + (isToday ? ' oggi' : '');

    const numDiv = document.createElement('div');
    numDiv.className = 'day-num';
    numDiv.textContent = d;
    cell.appendChild(numDiv);

    const dayStr = cellDateStr(currentYear, currentMonth, d);
    const evs    = eventsForDay(dayStr);
    const evDiv  = document.createElement('div');
    evDiv.className = 'day-events';

    evs.slice(0, 3).forEach(ev => {
      const startStr = toDateStr(ev.start);
      let endStr = toDateStr(ev.end);
      if (ev.end && ev.end.date) endStr = addDays(endStr, -1);
      const isMulti       = startStr !== endStr;
      const isContinuaSx  = isMulti && dayStr > startStr;
      const isContinuaDx  = isMulti && dayStr < endStr;

      const pill = document.createElement('div');
      let extraClass = '';
      if (isContinuaSx && isContinuaDx) extraClass = ' continua-entrambi';
      else if (isContinuaSx) extraClass = ' continua-sx';
      else if (isContinuaDx) extraClass = ' continua-dx';
      pill.className = 'event-pill ' + ev._classe + extraClass;

      if (!isContinuaSx) {
        pill.appendChild(iconaEvento(ev));
        const txt = document.createElement('span');
        txt.className = 'pill-txt';
        txt.textContent = ev.summary || '(senza titolo)';
        pill.appendChild(txt);
      } else {
        const txt = document.createElement('span');
        txt.className = 'pill-txt';
        txt.textContent = '▸ ' + (ev.summary || '');
        pill.appendChild(txt);
      }
      pill.title = ev.summary || '';
      pill.addEventListener('click', () => showPopup(ev));
      evDiv.appendChild(pill);
    });

    if (evs.length > 3) {
      const more = document.createElement('div');
      more.className = 'more-events';
      more.textContent = '+' + (evs.length - 3) + ' altri';
      evDiv.appendChild(more);
    }
    cell.appendChild(evDiv);
    cells.appendChild(cell);
  }

  const totalCells = firstDay + daysInMonth;
  const remainder  = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remainder; d++) {
    const cell = document.createElement('div');
    cell.className = 'cal-day altro-mese';
    cell.innerHTML = `<div class="day-num">${d}</div>`;
    cells.appendChild(cell);
  }
}

/* ══════════════════════════════════════════
   POPUP
══════════════════════════════════════════ */
function rigaPopup(id, nomeIcona, testo) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  if (!testo) return;
  if (nomeIcona) el.appendChild(icona(nomeIcona));
  const t = document.createElement('span');
  t.textContent = testo;
  el.appendChild(t);
}

function showPopup(ev) {
  document.getElementById('popup-title').textContent = ev.summary || '(senza titolo)';

  const cat = document.getElementById('popup-cat');
  cat.innerHTML = '';
  cat.appendChild(icona(ev._classe, null, COLORI[ev._classe]));
  const catTxt = document.createElement('span');
  catTxt.textContent = ev._calNome;
  cat.appendChild(catTxt);

  rigaPopup('popup-date', 'data',   fmtData(ev.start));
  rigaPopup('popup-time', 'orario', fmtOra(ev.start));
  rigaPopup('popup-loc',  'luogo',  ev.location || '');
  rigaPopup('popup-desc', null, ev.description ? ev.description.replace(/<[^>]+>/g,'').substring(0,250) : '');

  const allegatiDiv = document.getElementById('popup-allegati');
  allegatiDiv.innerHTML = '';
  if (ev.attachments && ev.attachments.length) {
    ev.attachments.forEach(att => {
      const a = document.createElement('a');
      a.className = 'popup-att';
      a.href = att.fileUrl; a.target = '_blank'; a.rel = 'noopener';
      const mime = att.mimeType || '';
      a.appendChild(icona(mime.includes('image') ? 'immagine' : mime.includes('pdf') ? 'file' : 'allegato'));
      const t = document.createElement('span');
      t.textContent = att.title || 'Apri allegato';
      a.appendChild(t);
      allegatiDiv.appendChild(a);
    });
  }

  document.getElementById('popup-overlay').style.display = 'block';
  document.getElementById('event-popup').style.display   = 'block';
}
function hidePopup() {
  document.getElementById('popup-overlay').style.display = 'none';
  document.getElementById('event-popup').style.display   = 'none';
}

/* ══════════════════════════════════════════
   PULSANTI VISTA
══════════════════════════════════════════ */
function setActiveBtn(id) {
  ['btn-oggi-btn','btn-list','btn-grid'].forEach(b => document.getElementById(b).classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('btn-oggi-btn').addEventListener('click', () => {
  currentView = 'oggi';
  setActiveBtn('btn-oggi-btn');
  const now = new Date();
  if (currentYear !== now.getFullYear() || currentMonth !== now.getMonth()) {
    currentYear = now.getFullYear(); currentMonth = now.getMonth();
    updateLabel(); loadEvents();
  } else {
    renderCurrent();
  }
});
document.getElementById('btn-list').addEventListener('click', () => {
  currentView = 'list'; setActiveBtn('btn-list'); renderCurrent();
});
document.getElementById('btn-grid').addEventListener('click', () => {
  currentView = 'grid'; setActiveBtn('btn-grid'); renderCurrent();
});

document.getElementById('popup-close').addEventListener('click', hidePopup);
document.getElementById('popup-overlay').addEventListener('click', hidePopup);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePopup(); });

/* ══════════════════════════════════════════
   AVVIO
══════════════════════════════════════════ */
setActiveBtn('btn-oggi-btn');
updateLabel();
loadEvents();
</script>
