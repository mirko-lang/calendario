<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario della Comunità — U.P. Meloncello-Ravone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    /* PALETTE ISTITUZIONALE — teal #45818e + oro #c8973a */
    --blu: #45818e; --blu-dark: #2f5a63; --blu-deep: #234850; --blu-light: #edf4f5;
    --oro: #c8973a; --oro-light: #e8d4a8; --crema: #fdfaf3;
    --testo: #1b2b2f; --testo-sec: #5d6f74;
    --bordo: #dce8ea; --radius: 10px;

    /* Sfondi tenui per categoria */
    --bg-festivita:  #fbf4e4;
    --bg-messe:      rgba( 69, 129, 142, 0.075);
    --bg-preghiera:  rgba( 31,  78, 121, 0.070);
    --bg-fraternita: rgba( 91,  33, 182, 0.060);
    --bg-catechismo: rgba(163,  58,   0, 0.060);
    --bg-caritas:    rgba( 45, 122,  58, 0.070);
    --bg-tempo:      rgba(194,  24,  91, 0.055);
    --bg-info:       rgba( 74,  85,  96, 0.050);

    /* Bordi laterali */
    --brd-festivita:  #c8973a;
    --brd-messe:      #45818e;
    --brd-preghiera:  #1f4e79;
    --brd-fraternita: #5b21b6;
    --brd-catechismo: #a33a00;
    --brd-caritas:    #2d7a3a;
    --brd-tempo:      #c2185b;
    --brd-info:       #4a5560;
  }

  /* WRAPPER: si adatta a qualsiasi altezza/larghezza dell'iframe */
  #cal-wrapper {
    width: 100%; height: 100%;
    background: #fff;
    border: 1px solid var(--bordo);
    border-radius: var(--radius);
    box-shadow: 0 4px 22px rgba(35,72,80,0.10);
    overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 240px;
  }

  /* Scrollbar sottili */
  #cal-scroll, #cal-legend { scrollbar-width: thin; scrollbar-color: #c3d8dc transparent; }
  #cal-scroll::-webkit-scrollbar { width: 7px; }
  #cal-scroll::-webkit-scrollbar-thumb { background: #c3d8dc; border-radius: 4px; }
  #cal-legend::-webkit-scrollbar { height: 0; }

  /* ══════════ HEADER ══════════ */
  #cal-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: linear-gradient(135deg, var(--blu) 0%, var(--blu-deep) 100%);
    padding: .5rem .8rem; color: #fff; flex-shrink: 0; min-width: 0;
    border-bottom: 2px solid var(--oro);
  }
  .header-title {
    font-size: 12.5px; font-weight: 900; letter-spacing: .11em; text-transform: uppercase;
    line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .header-sub {
    font-size: 9.5px; font-weight: 300; color: rgba(255,255,255,.72); margin-top: 2px;
    letter-spacing: .05em; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #cal-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  #cal-nav button.nav-arrow {
    background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px; color: #fff; cursor: pointer; width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: background .15s, border-color .15s;
  }
  #cal-nav button.nav-arrow:hover { background: rgba(255,255,255,.30); border-color: rgba(255,255,255,.4); }
  #cal-nav button.nav-arrow svg { width: 15px; height: 15px; fill: currentColor; }
  #cal-label {
    font-size: 11.5px; font-weight: 700; letter-spacing: .03em; color: #fff;
    min-width: 148px; text-align: center; white-space: nowrap;
  }
  #btn-today {
    background: var(--oro); border: none; border-radius: 20px; color: #fff;
    font-family: inherit; font-size: 10px; font-weight: 900; letter-spacing: .08em;
    text-transform: uppercase; cursor: pointer; padding: 5px 12px; margin-left: 4px;
    transition: filter .15s;
  }
  #btn-today:hover { filter: brightness(1.1); }

  /* ══════════ TOGGLE VISTE ══════════ */
  #view-toggle {
    display: flex; gap: 2px; background: var(--blu-light);
    border-bottom: 1px solid var(--bordo); padding: 0 .8rem; flex-shrink: 0;
  }
  #view-toggle button {
    background: none; border: none; padding: .38rem .9rem;
    font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; cursor: pointer; color: var(--testo-sec);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: flex; align-items: center; gap: 6px; transition: color .15s, border-color .15s;
  }
  #view-toggle button svg { width: 13px; height: 13px; fill: currentColor; opacity: .75; }
  #view-toggle button.active { color: var(--blu-deep); border-bottom-color: var(--oro); }
  #view-toggle button.active svg { opacity: 1; }
  #view-toggle button:hover:not(.active) { color: var(--blu-dark); }

  /* ══════════ CORPO ══════════ */
  #cal-body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
  #cal-scroll { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: .5rem .75rem .8rem; }

  #cal-loading { padding: 1.8rem 1rem; text-align: center; color: var(--testo-sec); font-size: 12px; }
  .spinner {
    width: 24px; height: 24px; border: 3px solid var(--blu-light); border-top-color: var(--blu);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ico { width: 16px; height: 16px; flex-shrink: 0; display: block; }

  /* ══════════ INTESTAZIONE GIORNO ══════════ */
  .giorno { margin-bottom: .55rem; }
  .giorno-hdr {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 2px 4px; margin-bottom: .35rem;
    position: sticky; top: -.5rem; background: #fff; z-index: 3;
  }
  .giorno-hdr .gh-txt {
    font-size: 10.5px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase;
    color: var(--blu-deep); white-space: nowrap;
  }
  .giorno-hdr .gh-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--oro-light), transparent); }
  .giorno.is-oggi .giorno-hdr { background: #fff; }
  .giorno.is-oggi .gh-badge {
    background: var(--oro); color: #fff; font-size: 8.5px; font-weight: 900;
    letter-spacing: .12em; padding: 2px 7px; border-radius: 20px; text-transform: uppercase;
  }
  .giorno.is-oggi .gh-txt { color: var(--oro); }
  .giorno.is-domenica .gh-txt { color: var(--blu); }

  /* Banda festività / liturgia */
  .fest-strip {
    display: flex; align-items: center; gap: 7px;
    background: var(--bg-festivita); border-left: 3px solid var(--brd-festivita);
    border-radius: 4px; padding: .32rem .55rem; margin-bottom: .28rem;
    cursor: pointer; transition: filter .12s;
  }
  .fest-strip:hover { filter: brightness(.975); }
  .fest-strip .ico { width: 14px; height: 14px; color: var(--oro); }
  .fest-strip .fest-txt {
    font-size: 12px; font-weight: 700; color: #8a6410; line-height: 1.3; letter-spacing: .01em;
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ══════════ RIGA EVENTO ══════════ */
  .ev {
    display: flex; align-items: stretch; gap: 0;
    background: #fff; border: 1px solid var(--bordo);
    border-left: 3px solid var(--blu); border-radius: 5px;
    margin-bottom: .28rem; cursor: pointer;
    transition: box-shadow .15s, border-color .15s;
  }
  .ev:hover { box-shadow: 0 2px 10px rgba(35,72,80,.11); }
  .ev.messe      { border-left-color: var(--brd-messe);      background: var(--bg-messe); }
  .ev.preghiera  { border-left-color: var(--brd-preghiera);  background: var(--bg-preghiera); }
  .ev.fraternita { border-left-color: var(--brd-fraternita); background: var(--bg-fraternita); }
  .ev.catechismo { border-left-color: var(--brd-catechismo); background: var(--bg-catechismo); }
  .ev.caritas    { border-left-color: var(--brd-caritas);    background: var(--bg-caritas); }
  .ev.tempo      { border-left-color: var(--brd-tempo);      background: var(--bg-tempo); }
  .ev.info       { border-left-color: var(--brd-info);       background: var(--bg-info); }
  .ev.festività  { border-left-color: var(--brd-festivita);  background: var(--bg-festivita); }

  .ev-time {
    flex-shrink: 0; width: 58px; padding: .42rem .3rem .42rem .5rem;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    border-right: 1px solid rgba(200,151,58,.35);
  }
  .ev-time .ora { font-size: 14px; font-weight: 900; color: var(--blu-deep); line-height: 1.05; letter-spacing: -.01em; }
  .ev-time .ora-fine { font-size: 9.5px; font-weight: 400; color: var(--testo-sec); line-height: 1.2; margin-top: 1px; }
  .ev-time .tuttogiorno {
    font-size: 8.5px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase;
    color: var(--testo-sec); line-height: 1.2;
  }

  .ev-main { flex: 1; min-width: 0; padding: .42rem .55rem; display: flex; align-items: center; gap: 7px; }
  .ev-icon { width: 17px; height: 17px; flex-shrink: 0; }
  .ev-body { flex: 1; min-width: 0; }
  .ev-title {
    font-size: 12.5px; font-weight: 700; color: var(--testo); line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ev-meta {
    font-size: 10px; font-weight: 400; color: var(--testo-sec); margin-top: 2px;
    line-height: 1.3; display: flex; align-items: center; gap: 4px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .ev-meta svg { width: 10px; height: 10px; fill: currentColor; flex-shrink: 0; }
  .ev-meta .meta-txt { overflow: hidden; text-overflow: ellipsis; }

  /* Giorno senza appuntamenti */
  .giorno-vuoto {
    font-size: 10.5px; font-weight: 300; font-style: italic; color: #9fb2b6;
    padding: .3rem .1rem .4rem; letter-spacing: .02em;
  }
  .periodo-vuoto {
    text-align: center; padding: 2rem 1rem; color: var(--testo-sec); font-size: 12.5px; line-height: 1.6;
  }
  .periodo-vuoto svg { width: 30px; height: 30px; fill: #c3d8dc; margin: 0 auto .5rem; display: block; }

  /* PULSANTE ALLEGATO */
  .att-btn {
    flex-shrink: 0; align-self: stretch; margin-left: auto;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    padding: 0 9px; border-radius: 4px; text-decoration: none;
    background: linear-gradient(135deg,#dba53f,#c8973a); color: #fff;
    box-shadow: 0 1px 5px rgba(200,151,58,.35); white-space: nowrap; min-width: 42px;
    transition: filter .15s;
  }
  .att-btn:hover { filter: brightness(1.08); }
  .att-btn svg { width: 14px; height: 14px; fill: currentColor; }
  .att-btn span { font-size: 8px; font-weight: 900; letter-spacing: .06em; line-height: 1; }

  /* ══════════ LEGENDA ══════════ */
  #cal-legend {
    display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 11px; align-items: center;
    padding: .35rem .8rem; background: var(--crema);
    border-top: 1px solid var(--bordo); font-size: 9.5px; color: var(--testo-sec);
    flex-shrink: 0; letter-spacing: .02em;
  }
  .legend-item { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .legend-item svg { width: 11px; height: 11px; fill: currentColor; flex-shrink: 0; }

  /* ══════════ FOOTER ══════════ */
  #cal-footer {
    text-align: center; font-size: 9px; font-weight: 400; letter-spacing: .09em;
    text-transform: uppercase; color: rgba(255,255,255,.6);
    background: var(--blu-deep); padding: .3rem 0; flex-shrink: 0;
  }

  /* ══════════ POPUP ══════════ */
  #popup-overlay { display: none; position: fixed; inset: 0; background: rgba(20,45,50,.42); z-index: 998; }
  #event-popup {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: #fff; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.25);
    padding: 1.1rem 1.2rem; z-index: 999; width: 92%; max-width: 350px;
    border-top: 4px solid var(--oro); max-height: 88%; overflow-y: auto;
  }
  #event-popup h4 {
    font-size: 15px; font-weight: 900; color: var(--blu-deep); line-height: 1.3;
    margin-bottom: .5rem; padding-right: 1.5rem;
  }
  .popup-row {
    font-size: 12px; color: var(--testo-sec); margin-bottom: 3px; line-height: 1.5;
    display: flex; align-items: flex-start; gap: 6px;
  }
  .popup-row svg { width: 12px; height: 12px; fill: currentColor; margin-top: 3px; flex-shrink: 0; }
  .popup-row:empty { display: none; }
  #popup-close {
    position: absolute; top: 7px; right: 9px; background: none; border: none; cursor: pointer;
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    color: var(--testo-sec); border-radius: 5px;
  }
  #popup-close:hover { background: var(--blu-light); }
  #popup-close svg { width: 15px; height: 15px; fill: currentColor; }
  .popup-att {
    display: flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 5px;
    background: var(--blu-light); border: 1px solid var(--bordo); color: var(--blu-dark);
    font-size: 12px; font-weight: 700; text-decoration: none; transition: background .15s;
  }
  .popup-att:hover { background: #dfecee; }
  .popup-att svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

  /* ══════════ ADATTAMENTI ══════════ */
  @media (max-height: 520px) {
    .ev-meta { display: none; }
    .ev-time { width: 52px; }
    .ev-time .ora { font-size: 13px; }
    .ev-title { font-size: 12px; }
    #cal-footer { display: none; }
  }
  @media (max-height: 400px) {
    #cal-legend { display: none; }
    .header-sub { display: none; }
  }
  @media (max-width: 560px) {
    #cal-header { padding: .45rem .55rem; gap: 6px; }
    .header-title { font-size: 11px; letter-spacing: .07em; }
    #cal-label { min-width: 0; font-size: 10.5px; }
    #btn-today { padding: 4px 9px; font-size: 9px; }
    #view-toggle button { padding: .35rem .6rem; font-size: 10px; }
    #view-toggle button svg { display: none; }
    #cal-scroll { padding: .45rem .5rem .7rem; }
    .ev-time { width: 50px; padding-left: .4rem; }
    .ev-time .ora { font-size: 13px; }
    .ev-title { font-size: 12px; }
  }
  @media (max-width: 400px) {
    .header-sub { display: none; }
    #cal-nav button.nav-arrow { width: 24px; height: 24px; }
  }
</style>
</head>
<body>
<div id="cal-wrapper">

  <!-- HEADER -->
  <div id="cal-header">
    <div style="min-width:0">
      <div class="header-title">Calendario della Comunità</div>
      <div class="header-sub">Unità Pastorale Meloncello · Ravone</div>
    </div>
    <div id="cal-nav">
      <button id="btn-prev" class="nav-arrow" title="Periodo precedente" aria-label="Periodo precedente"></button>
      <div id="cal-label">—</div>
      <button id="btn-next" class="nav-arrow" title="Periodo successivo" aria-label="Periodo successivo"></button>
      <button id="btn-today" title="Torna a oggi">Oggi</button>
    </div>
  </div>

  <!-- TOGGLE VISTE -->
  <div id="view-toggle">
    <button id="btn-week" class="active">Settimana</button>
    <button id="btn-month">Mese</button>
  </div>

  <!-- CORPO -->
  <div id="cal-body">
    <div id="cal-loading"><div class="spinner"></div>Caricamento eventi…</div>
    <div id="cal-scroll" style="display:none"></div>
  </div>

  <!-- LEGENDA -->
  <div id="cal-legend"></div>

  <!-- FOOTER -->
  <div id="cal-footer">zonapastoralemera.org</div>
</div>

<div id="popup-overlay"></div>
<div id="event-popup">
  <button id="popup-close" title="Chiudi" aria-label="Chiudi"></button>
  <h4 id="popup-title"></h4>
  <div class="popup-row" id="popup-cat"></div>
  <div class="popup-row" id="popup-date"></div>
  <div class="popup-row" id="popup-time"></div>
  <div class="popup-row" id="popup-loc"></div>
  <div class="popup-row" id="popup-desc"></div>
  <div id="popup-allegati" style="margin-top:.7rem;display:flex;flex-direction:column;gap:5px;"></div>
</div>

  'immagine':   'M21 19V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z',
  'allegato':   'M16.5 6v11.5a4 4 0 01-8 0V5a2.5 2.5 0 015 0v10.5a1 1 0 01-2 0V6H10v9.5a2.5 2.5 0 005 0V5a4 4 0 00-8 0v12.5a5.5 5.5 0 0011 0V6h-1.5z',
  'vuoto':      'M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm0 16H5V9h14v10zM7 11h5v5H7z'
};
const COLORI = {
  'info': '#4a5560', 'festività': '#c8973a', 'messe': '#45818e', 'preghiera': '#1f4e79',
  'fraternita': '#5b21b6', 'catechismo': '#a33a00', 'caritas': '#2d7a3a', 'tempo': '#c2185b'
};
function icona(nome, classeCss, colore) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', '16');
  svg.setAttribute('height', '16');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('class', 'ico' + (classeCss ? ' ' + classeCss : ''));
  if (colore) svg.style.color = colore;
  const p = document.createElementNS(SVG_NS, 'path');
  p.setAttribute('d', ICONE[nome] || ICONE['info']);
  p.setAttribute('fill', 'currentColor');
  svg.appendChild(p);
  return svg;
}
function iconaEvento(ev, classeCss) {
  return icona(ev._classe, classeCss, COLORI[ev._classe]);
}

/* ══════════════════════════════════════════
   CALENDARI
══════════════════════════════════════════ */
const CALENDARI = [
  { id: 'info@zonapastoralemera.org',                                                                    nome: 'Info UP',      classe: 'info' },
  { id: 'c_b455bc57387a5c5faaa42e9684fde524760b588945622a2bcdd98f968f130347@group.calendar.google.com', nome: 'Festività',    classe: 'festività' },
  { id: 'c_b80be427683a0e1224a0f8a8ccdad245e53314ce4c5d0756ac3d0fe7f39c8b90@group.calendar.google.com', nome: 'Messe',        classe: 'messe' },
  { id: 'c_9c7e450ddfd109ef1507027ce8c7d3ba8594cf826f43e1a9e1c1d359fcefaa42@group.calendar.google.com', nome: 'Preghiera',    classe: 'preghiera' },
  { id: 'c_403fbd4a7b8315233eee4790cff334596f3b992c8e30519f82c4abfd324efaf1@group.calendar.google.com', nome: 'Fraternità',   classe: 'fraternita' },
  { id: 'c_7e5f3c1c5e81b0e3a41ad216f1a92a68e4691b7f0bbd7323b71292207a6ff871@group.calendar.google.com', nome: 'Catechismo',   classe: 'catechismo' },
  { id: 'c_f34b010b4636290c886658f13c45b93ca8c0481fc62d46ec7d5a3824e5e218bf@group.calendar.google.com', nome: 'Caritas',      classe: 'caritas' },
  { id: 'c_1941933579b8ca22ba3fae59aa099c265b7b2cb392e16713b236363c51c55660@group.calendar.google.com', nome: 'Tempo libero', classe: 'tempo' },
];

const MESI       = ['gennaio','febbraio','marzo','aprile','maggio','giugno',
                    'luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MESI_BREVI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const GIORNI     = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];

const API_KEY = 'AIzaSyBRoKXJaV84XCJezZvsZT33fz_5J2urTKM';

let vista     = 'week';        /* 'week' | 'month' */
let ancora    = new Date();    /* un giorno qualsiasi dentro il periodo mostrato */
let allEvents = [];
let richiesta = 0;             /* per scartare risposte obsolete */

/* ══════════════════════════════════════════
   UTILITÀ DATE (sempre in orario locale)
══════════════════════════════════════════ */
function localStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function toDateStr(dt) {
  if (!dt) return null;
  if (dt.date) return dt.date;
  return localStr(new Date(dt.dateTime));
}
function addDaysStr(dateStr, n) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dd = new Date(y, m-1, d);
  dd.setDate(dd.getDate() + n);
  return localStr(dd);
}
function inizioSettimana(d) {              /* lunedì */
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function periodo() {
  if (vista === 'week') {
    const s = inizioSettimana(ancora);
    const e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6, 23, 59, 59);
    return { s, e };
  }
  const s = new Date(ancora.getFullYear(), ancora.getMonth(), 1);
  const e = new Date(ancora.getFullYear(), ancora.getMonth() + 1, 0, 23, 59, 59);
  return { s, e };
}
function etichettaPeriodo() {
  const { s, e } = periodo();
  if (vista === 'month') return MESI[s.getMonth()].toUpperCase() + ' ' + s.getFullYear();
  if (s.getMonth() === e.getMonth()) {
    return s.getDate() + ' – ' + e.getDate() + ' ' + MESI[s.getMonth()] + ' ' + s.getFullYear();
  }
  if (s.getFullYear() === e.getFullYear()) {
    return s.getDate() + ' ' + MESI_BREVI[s.getMonth()] + ' – ' + e.getDate() + ' ' + MESI_BREVI[e.getMonth()] + ' ' + e.getFullYear();
  }
  return s.getDate() + ' ' + MESI_BREVI[s.getMonth()] + ' ' + s.getFullYear() + ' – '
       + e.getDate() + ' ' + MESI_BREVI[e.getMonth()] + ' ' + e.getFullYear();
}
function fmtOra(dt) {
  if (!dt || !dt.dateTime) return '';
  return new Date(dt.dateTime).toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
}
function fmtDataEstesa(dt) {
  if (!dt) return '';
  const d = new Date(dt.dateTime || dt.date);
  return GIORNI[d.getDay()] + ' ' + d.getDate() + ' ' + MESI[d.getMonth()] + ' ' + d.getFullYear();
}
function isTuttoIlGiorno(ev) { return !ev.start.dateTime; }
function isFestivita(ev)     { return ev._classe === 'festività'; }

function ordinaEventi(arr) {
  return arr.slice().sort((a, b) => {
    const fa = isFestivita(a) ? 0 : 1, fb = isFestivita(b) ? 0 : 1;
    if (fa !== fb) return fa - fb;
    const ta = !!a.start.dateTime, tb = !!b.start.dateTime;
    if (ta !== tb) return ta ? -1 : 1;
    return new Date(a.start.dateTime || a.start.date) - new Date(b.start.dateTime || b.start.date);
  });
}
function eventiDelGiorno(dayStr) {
  return ordinaEventi(allEvents.filter(ev => {
    const start = toDateStr(ev.start);
    let end = toDateStr(ev.end);
    if (ev.end && ev.end.date) end = addDaysStr(end, -1);
    return start <= dayStr && dayStr <= end;
  }));
}

/* ══════════════════════════════════════════
   CHROME (legenda, icone, etichette)
══════════════════════════════════════════ */
(function initChrome() {
  const leg = document.getElementById('cal-legend');
  CALENDARI.forEach(cal => {
    const d = document.createElement('div');
    d.className = 'legend-item';
    d.appendChild(icona(cal.classe, null, COLORI[cal.classe]));
    d.appendChild(document.createTextNode(cal.nome));
    leg.appendChild(d);
  });
  document.getElementById('btn-prev').appendChild(icona('prev'));
  document.getElementById('btn-next').appendChild(icona('next'));
  document.getElementById('popup-close').appendChild(icona('close'));
  const b1 = document.getElementById('btn-week');  b1.insertBefore(icona('settimana'), b1.firstChild);
  const b2 = document.getElementById('btn-month'); b2.insertBefore(icona('data'),      b2.firstChild);
})();

function aggiornaEtichette() {
  document.getElementById('cal-label').textContent = etichettaPeriodo();
  const p = document.getElementById('btn-prev'), n = document.getElementById('btn-next');
  if (vista === 'week') {
    p.title = 'Settimana precedente'; n.title = 'Settimana successiva';
  } else {
    p.title = 'Mese precedente'; n.title = 'Mese successivo';
  }
  p.setAttribute('aria-label', p.title); n.setAttribute('aria-label', n.title);
}

/* ══════════════════════════════════════════
   CARICAMENTO EVENTI
══════════════════════════════════════════ */
async function loadEvents() {
  const mio = ++richiesta;
  document.getElementById('cal-loading').style.display = 'block';
  document.getElementById('cal-scroll').style.display  = 'none';

  const { s, e } = periodo();
  const timeMin = new Date(s.getFullYear(), s.getMonth(), s.getDate(), 0, 0, 0).toISOString();
  const timeMax = new Date(e.getFullYear(), e.getMonth(), e.getDate(), 23, 59, 59).toISOString();

  const promises = CALENDARI.map(cal => {
    const url = 'https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(cal.id) + '/events'
      + '?key=' + API_KEY
      + '&timeMin=' + encodeURIComponent(timeMin)
      + '&timeMax=' + encodeURIComponent(timeMax)
      + '&singleEvents=true&orderBy=startTime&maxResults=250&supportsAllDrives=true'
      + '&fields=items(id,summary,description,start,end,location,attachments)';
    return fetch(url).then(r => r.json()).then(data => {
      if (data.error) return [];
      return (data.items || []).map(ev => ({ ...ev, _classe: cal.classe, _calNome: cal.nome }));
    }).catch(() => []);
  });

  try {
    const results = await Promise.all(promises);
    if (mio !== richiesta) return;                       /* risposta obsoleta */
    allEvents = results.flat().sort((a,b) =>
      new Date(a.start.dateTime || a.start.date) - new Date(b.start.dateTime || b.start.date));
  } catch (err) {
    if (mio !== richiesta) return;
    allEvents = [];
  }
  render();
}

/* ══════════════════════════════════════════
   COSTRUZIONE RIGHE
══════════════════════════════════════════ */
function creaBtnAllegato(ev) {
  if (!ev.attachments || !ev.attachments.length) return null;
  const a = document.createElement('a');
  a.className = 'att-btn';
  a.href = ev.attachments[0].fileUrl;
  a.target = '_blank';
  a.rel = 'noopener';
  const mime = ev.attachments[0].mimeType || '';
  a.appendChild(icona(mime.includes('image') ? 'immagine' : mime.includes('pdf') ? 'file' : 'allegato'));
  const lbl = document.createElement('span');
  lbl.textContent = 'APRI';
  a.appendChild(lbl);
  a.addEventListener('click', e => e.stopPropagation());
  return a;
}

function creaBandaFestivita(ev) {
  const s = document.createElement('div');
  s.className = 'fest-strip';
  s.appendChild(icona('festività'));
  const t = document.createElement('div');
  t.className = 'fest-txt';
  t.textContent = ev.summary || '(senza titolo)';
  t.title = ev.summary || '';
  s.appendChild(t);
  const att = creaBtnAllegato(ev);
  if (att) s.appendChild(att);
  s.addEventListener('click', () => showPopup(ev));
  return s;
}

function creaRigaEvento(ev) {
  const row = document.createElement('div');
  row.className = 'ev ' + ev._classe;

  /* colonna orario */
  const time = document.createElement('div');
  time.className = 'ev-time';
  if (isTuttoIlGiorno(ev)) {
    const tg = document.createElement('div');
    tg.className = 'tuttogiorno';
    tg.textContent = 'tutto il giorno';
    time.appendChild(tg);
  } else {
    const ora = document.createElement('div');
    ora.className = 'ora';
    ora.textContent = fmtOra(ev.start);
    time.appendChild(ora);
    const fine = fmtOra(ev.end);
    if (fine && fine !== fmtOra(ev.start)) {
      const of = document.createElement('div');
      of.className = 'ora-fine';
      of.textContent = '→ ' + fine;
      time.appendChild(of);
    }
  }
  row.appendChild(time);

  /* corpo */
  const main = document.createElement('div');
  main.className = 'ev-main';
  main.appendChild(iconaEvento(ev, 'ev-icon'));

  const body = document.createElement('div');
  body.className = 'ev-body';

  const titolo = document.createElement('div');
  titolo.className = 'ev-title';
  titolo.textContent = ev.summary || '(senza titolo)';
  titolo.title = ev.summary || '';
  body.appendChild(titolo);

  const meta = document.createElement('div');
  meta.className = 'ev-meta';
  if (ev.location) {
    meta.appendChild(icona('luogo'));
    const t = document.createElement('span');
    t.className = 'meta-txt';
    t.textContent = ev.location;
    t.title = ev.location;
    meta.appendChild(t);
  } else {
    const t = document.createElement('span');
    t.className = 'meta-txt';
    t.textContent = ev._calNome;
    meta.appendChild(t);
  }
  body.appendChild(meta);
  main.appendChild(body);

  const att = creaBtnAllegato(ev);
  if (att) main.appendChild(att);

  row.appendChild(main);
  row.addEventListener('click', () => showPopup(ev));
  return row;
}

function creaBloccoGiorno(data, opzioni) {
  const dayStr = localStr(data);
  const oggiStr = localStr(new Date());
  const eventi = eventiDelGiorno(dayStr);
  const festivita = eventi.filter(isFestivita);
  const altri = eventi.filter(ev => !isFestivita(ev));

  if (!opzioni.mostraVuoti && !eventi.length) return null;

  const blocco = document.createElement('div');
  blocco.className = 'giorno'
    + (dayStr === oggiStr ? ' is-oggi' : '')
    + (data.getDay() === 0 ? ' is-domenica' : '');
  if (dayStr === oggiStr) blocco.id = 'blocco-oggi';

  const hdr = document.createElement('div');
  hdr.className = 'giorno-hdr';
  if (dayStr === oggiStr) {
    const badge = document.createElement('span');
    badge.className = 'gh-badge';
    badge.textContent = 'Oggi';
    hdr.appendChild(badge);
  }
  const txt = document.createElement('div');
  txt.className = 'gh-txt';
  txt.textContent = GIORNI[data.getDay()] + ' ' + data.getDate() + ' ' + MESI[data.getMonth()];
  hdr.appendChild(txt);
  const line = document.createElement('div');
  line.className = 'gh-line';
  hdr.appendChild(line);
  blocco.appendChild(hdr);

  festivita.forEach(ev => blocco.appendChild(creaBandaFestivita(ev)));
  altri.forEach(ev => blocco.appendChild(creaRigaEvento(ev)));

  if (!eventi.length) {
    const v = document.createElement('div');
    v.className = 'giorno-vuoto';
    v.textContent = 'Nessun appuntamento';
    blocco.appendChild(v);
  }
  return blocco;
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function render() {
  document.getElementById('cal-loading').style.display = 'none';
  const sc = document.getElementById('cal-scroll');
  sc.style.display = 'block';
  sc.innerHTML = '';
  aggiornaEtichette();

  const { s, e } = periodo();
  const giorni = Math.round((new Date(e.getFullYear(), e.getMonth(), e.getDate()) - s) / 86400000) + 1;
  let inseriti = 0;

  for (let i = 0; i < giorni; i++) {
    const d = new Date(s.getFullYear(), s.getMonth(), s.getDate() + i);
    const blocco = creaBloccoGiorno(d, { mostraVuoti: vista === 'week' });
    if (blocco) { sc.appendChild(blocco); inseriti++; }
  }

  if (!inseriti) {
    const v = document.createElement('div');
    v.className = 'periodo-vuoto';
    v.appendChild(icona('vuoto'));
    v.appendChild(document.createTextNode(
      vista === 'week' ? 'Nessun appuntamento in questa settimana.' : 'Nessun appuntamento in questo mese.'));
    sc.appendChild(v);
    return;
  }

  const oggiEl = document.getElementById('blocco-oggi');
  if (oggiEl && vista === 'month') sc.scrollTop = Math.max(0, oggiEl.offsetTop - sc.offsetTop - 4);
  else sc.scrollTop = 0;
}

/* ══════════════════════════════════════════
   NAVIGAZIONE
══════════════════════════════════════════ */
function spostaPeriodo(passo) {
  if (vista === 'week') {
    ancora = new Date(ancora.getFullYear(), ancora.getMonth(), ancora.getDate() + 7 * passo);
  } else {
    ancora = new Date(ancora.getFullYear(), ancora.getMonth() + passo, 1);
  }
  aggiornaEtichette();
  loadEvents();
}
document.getElementById('btn-prev').addEventListener('click', () => spostaPeriodo(-1));
document.getElementById('btn-next').addEventListener('click', () => spostaPeriodo(1));
document.getElementById('btn-today').addEventListener('click', () => {
  ancora = new Date();
  aggiornaEtichette();
  loadEvents();
});

function setVista(nuova) {
  if (vista === nuova) return;
  vista = nuova;
  document.getElementById('btn-week').classList.toggle('active',  vista === 'week');
  document.getElementById('btn-month').classList.toggle('active', vista === 'month');
  aggiornaEtichette();
  loadEvents();
}
document.getElementById('btn-week').addEventListener('click',  () => setVista('week'));
document.getElementById('btn-month').addEventListener('click', () => setVista('month'));

/* ══════════════════════════════════════════
   POPUP
══════════════════════════════════════════ */
function rigaPopup(id, nomeIcona, testo) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  if (!testo) return;
  if (nomeIcona) el.appendChild(icona(nomeIcona));
  const t = document.createElement('span');
  t.textContent = testo;
  el.appendChild(t);
}

function showPopup(ev) {
  document.getElementById('popup-title').textContent = ev.summary || '(senza titolo)';

  const cat = document.getElementById('popup-cat');
  cat.innerHTML = '';
  cat.appendChild(icona(ev._classe, null, COLORI[ev._classe]));
  const catTxt = document.createElement('span');
  catTxt.textContent = ev._calNome;
  cat.appendChild(catTxt);

  rigaPopup('popup-date', 'data',   fmtDataEstesa(ev.start));
  rigaPopup('popup-time', 'orario', isTuttoIlGiorno(ev) ? 'Tutto il giorno'
            : fmtOra(ev.start) + (fmtOra(ev.end) ? ' – ' + fmtOra(ev.end) : ''));
  rigaPopup('popup-loc',  'luogo',  ev.location || '');
  rigaPopup('popup-desc', null, ev.description ? ev.description.replace(/<[^>]+>/g,'').substring(0,250) : '');

  const allegatiDiv = document.getElementById('popup-allegati');
  allegatiDiv.innerHTML = '';
  if (ev.attachments && ev.attachments.length) {
    ev.attachments.forEach(att => {
      const a = document.createElement('a');
      a.className = 'popup-att';
      a.href = att.fileUrl; a.target = '_blank'; a.rel = 'noopener';
      const mime = att.mimeType || '';
      a.appendChild(icona(mime.includes('image') ? 'immagine' : mime.includes('pdf') ? 'file' : 'allegato'));
      const t = document.createElement('span');
      t.textContent = att.title || 'Apri allegato';
      a.appendChild(t);
      allegatiDiv.appendChild(a);
    });
  }

  document.getElementById('popup-overlay').style.display = 'block';
  document.getElementById('event-popup').style.display   = 'block';
}
function hidePopup() {
  document.getElementById('popup-overlay').style.display = 'none';
  document.getElementById('event-popup').style.display   = 'none';
}
document.getElementById('popup-close').addEventListener('click', hidePopup);
document.getElementById('popup-overlay').addEventListener('click', hidePopup);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePopup(); });

/* ══════════════════════════════════════════
   AVVIO
══════════════════════════════════════════ */
aggiornaEtichette();
loadEvents();
</script>
